[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adhoc-crashfuzz"
version = "0.1.0"
description = "Target-guided fault fuzzing for distributed coordination checks"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
adhoc-crashfuzz = "adhoc_crashfuzz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
