id: solr-adhoc-k1
system: Apache Solr
source_tree: /set/by/run-case.sh
base_commit: 1eaa00b6e52
check:
  file: solr/test-framework/src/java/org/apache/solr/cloud/AbstractDistribZkTestBase.java
  line: 185
  method: AbstractDistribZkTestBase.waitForRecoveriesToFinish(String, ZkStateReader, boolean, boolean, int)
  thrown: java.lang.AssertionError
  guard: "sawLiveRecovering && cnt == timeoutSeconds && failOnTimeout   (sawLiveRecovering: a slice of zkStateReader.getClusterState().getCollectionOrNull(collection) is in CONSTRUCTION, or a replica on a live node is RECOVERING, DOWN or RECOVERY_FAILED; fail(...) from org.junit.Assert)"
workload:
  module: solr/core
  test: org.apache.solr.cloud.TestCloudRecovery#leaderRecoverFromLogOnStartupTest
  note: the test reaches the check's method and passes; the check does not fail in it
scope_hint:
