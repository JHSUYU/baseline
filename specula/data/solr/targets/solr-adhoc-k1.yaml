  - org.apache.solr.common.cloud.ClusterState
  - org.apache.solr.common.cloud.DocCollection
  - org.apache.solr.common.cloud.Slice
  - org.apache.solr.common.cloud.Replica
  - org.apache.solr.common.cloud.CollectionStateWatcher
  - org.apache.solr.common.cloud.CollectionStatePredicate
  - org.apache.solr.common.cloud.ClusterStateUtil
  - org.apache.solr.common.cloud.SolrZkClient
  - org.apache.solr.cloud.ZkController
  - org.apache.solr.cloud.Overseer
  - org.apache.solr.cloud.overseer.ZkStateWriter
