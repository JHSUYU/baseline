build:
  env: /set/by/run-case.sh
  prepare: "cd solr/core && ant -lib $IVY_USER_DIR/lib compile-test -Divy_install_path=$IVY_USER_DIR/lib   (already done once)"
  test_command: "cd solr/core && ant -lib $IVY_USER_DIR/lib test -Dtestcase=<Class> -Dtests.method=<method> -Dtests.jvms=1 -Dtests.useSecurityManager=false -Divy_install_path=$IVY_USER_DIR/lib"
