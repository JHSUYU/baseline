\* Scenario 3 (brief 2, MC-3): HA key source differs from the signing NN.
\* Two NNs (disjoint key ranges), one failover (W5: the new active signs at
\* once; each DN switches its current key only after processing that NN's
\* key update as active) and one dead-node removal / forced re-registration
\* (W6: registration with a stale ACTIVE actor state installs a standby's
\* key).  No rotation, so Scenario 1 cannot fire.  The no-op heartbeat
\* reduction is off (in-flight HA claims matter with two NNs).
SPECIFICATION MCSpec

CONSTANTS
    NN = {n1, n2}
    DN = {d1, d2}
    InitActive = n1
    None = None
    OverwriteQOP = TRUE
    Repl = 2
    XferTargets = 2
    StartRegistered = TRUE
    SkipNoopHeartbeats = FALSE    \* required with two NNs
    MaxRotations = 0
    MaxFailovers = 1
    MaxRestarts = 0
    MaxDeadNodes = 1
    MaxXfers = 0
    MaxWrites = 1
    MaxReads = 0

SYMMETRY DNSymmetry
CHECK_DEADLOCK FALSE

INVARIANTS
    \* target (or a refinement of it that selects one window)
    TargetSafe
    \* structural sanity under this Scenario's faults (brief 5; adhoc Shared Rule 1)
    TypeOK
    TokenProvenance
