\* Scenario 2 (brief 2, MC-2): a DN-signed replication token re-signed by a
\* skewed first target.  NN-scheduled multi-target replication (DNA_TRANSFER
\* with two targets; the source signs with its own currentKey, the first
\* target mirrors and re-signs with its own) plus one rotation applied by the
\* DNs at different times (W7).  Client writes and reads are off, so BFS
\* cannot return Scenario 1's client-write trigger instead.
SPECIFICATION MCSpec

CONSTANTS
    NN = {n1}
    DN = {d1, d2, d3}
    InitActive = n1
    None = None
    OverwriteQOP = TRUE
    Repl = 2
    XferTargets = 2
    StartRegistered = TRUE
    SkipNoopHeartbeats = TRUE
    MaxRotations = 1
    MaxFailovers = 0
    MaxRestarts = 0
    MaxDeadNodes = 0
    MaxXfers = 1
    MaxWrites = 0    \* no client writes: isolates Scenario 2
    MaxReads = 0

SYMMETRY DNSymmetry
CHECK_DEADLOCK FALSE

INVARIANTS
    \* target (or a refinement of it that selects one window)
    TargetSafe
    \* structural sanity under this Scenario's faults (brief 5; adhoc Shared Rule 1)
    TypeOK
    TokenProvenance
