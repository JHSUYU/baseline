\* Scenario 4 (brief 2, MC-4): NN restart under in-flight tokens.  The NN
\* restarts with fresh keys; DNs re-register (REGISTER from the heartbeat)
\* at different times and keep their old keys, while a token of the old
\* incarnation is still in flight.  No rotation (MaxRotations = 0), so the
\* restarted NN's first-pass rotation and Scenario 1 are excluded; a firing
\* here needs the old-incarnation token.
SPECIFICATION MCSpec

CONSTANTS
    NN = {n1}
    DN = {d1, d2}
    InitActive = n1
    None = None
    OverwriteQOP = TRUE
    Repl = 2
    XferTargets = 2
    StartRegistered = TRUE
    SkipNoopHeartbeats = TRUE
    MaxRotations = 0
    MaxFailovers = 0
    MaxRestarts = 1
    MaxDeadNodes = 0
    MaxXfers = 0
    MaxWrites = 1
    MaxReads = 0

SYMMETRY DNSymmetry
CHECK_DEADLOCK FALSE

INVARIANTS
    \* target (or a refinement of it that selects one window)
    TargetSafe
    \* structural sanity under this Scenario's faults (brief 5; adhoc Shared Rule 1)
    TypeOK
    TokenProvenance
