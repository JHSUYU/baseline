\* Hunt: Scenario 1 (brief MC-1) - a recovery daemon outlives its block-pool
\* service. A DNA_RECOVERBLOCK is accepted while the BPOS is registered; the
\* BPOS's last actor then exits (DataNode stop, or the NameNode rejecting the
\* DataNode after refreshNodes) and BlockPoolManager.remove deletes the
\* entry before the daemon's next getDatanodeID (BRW:131 -> 563-565),
\* including a dispatch that follows shutdownActor (BPOS:692-704).
\* Bounds (modeling-brief.md Section 5): 2 DataNodes, 1 NameNode, 1 block
\* pool, 2 locations, 2 recovery attempts, 1 BPOS per DataNode.
\* Only this Scenario's counters are set.
SPECIFICATION MCSpec

CONSTANTS
    DN                       = {d1, d2}
    NoDn                     = NoDn
    MaxSlot                  = 1
    MaxAttempts              = 2
    AssertionsEnabled        = TRUE

    MaxDnStops               = 1
    MaxNNRejects             = 1
    MaxNsMoves               = 0
    RecoveryAfterRefresh     = FALSE
    RefreshAfterRegistration = FALSE

SYMMETRY Symm

CHECK_DEADLOCK FALSE

CONSTRAINT
    StopAfterTarget

\* The target (the hunt's property)
INVARIANTS
    TargetSafe

\* Model honesty (brief Section 5 structural invariants; adhoc Shared Rule 1)
INVARIANTS
    TypeOK
    RecPoolFromSender
