\* Hunt variant of Scenario 2 (brief MC-2), persistent outcome only, as the
\* brief's Scenario 2 "Attribution" note asks: the NameNode starts lease
\* recovery only after the refresh finished (RecoveryAfterRefresh, see
\* MCNNStartRecovery). Every daemon is then dispatched after BPOS-old is
\* gone, so a TargetSafe violation means a live BPOS lost its entry.
\* The refresh also waits until BPOS-old registered and runs offerService
\* (RefreshAfterRegistration, see MCRefreshStartNew): the workload's state
\* after cluster.waitActive(), as in the brief's reproduction plan. With
\* RefreshAfterRegistration = FALSE the same bad order is also reachable
\* with the refresh racing BPOS-old's startup handshake.
\* Same bounds and the same single counter as MC_hunt_samepool.cfg.
SPECIFICATION MCSpec

CONSTANTS
    DN                       = {d1, d2}
    NoDn                     = NoDn
    MaxSlot                  = 2
    MaxAttempts              = 2
    AssertionsEnabled        = TRUE

    MaxDnStops               = 0
    MaxNNRejects             = 0
    MaxNsMoves               = 1
    RecoveryAfterRefresh     = TRUE
    RefreshAfterRegistration = TRUE

SYMMETRY Symm

CHECK_DEADLOCK FALSE

CONSTRAINT
    StopAfterTarget

INVARIANTS
    TargetSafe

INVARIANTS
    TypeOK
    RecPoolFromSender
