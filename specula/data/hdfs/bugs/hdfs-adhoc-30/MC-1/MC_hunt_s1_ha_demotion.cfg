\* Hunt: Scenario 1 (brief section 2), MC-1.  HA demotion window: a recovery accepted from the
\* active NN's actor; that NN leaves ACTIVE (DemoteNN: stopActiveServices clears its queue, writes
\* END_LOG_SEGMENT) and the DN applies its STANDBY heartbeat (W4, BPOfferService.java:608-612) before
\* any other NN's ACTIVE claim is accepted (W3).  Graceful failover: demote first, promote later.
\* Topology: 2 NNs, HA, n1 ACTIVE at Init.  Budgets: MaxDemote = MaxPromote = 1; all others 0.
CONSTANTS
    NN = {n1, n2}
    HA = TRUE
    InitActive = n1
    None = None
    EnableAssertions = TRUE
    Inc <- MCInc
    Rec <- MCRec
    MaxRecoveries = 1
    MaxRefresh = 0
    MaxDemote = 1   \* scenario budget
    MaxPromote = 1   \* scenario budget
    MaxNNCrash = 0
    MaxEdits = 0
    MaxActorExit = 0
    MaxReplicaFail = 0

INIT MCInit
NEXT MCNext

INVARIANTS
    \* target (adhoc Shared Rule 1)
    TargetSafe
    \* structural sanity (brief section 5); cheap, and checked here under this Scenario's faults
    ActiveActorAlive
    HbCarriesSenderState

CHECK_DEADLOCK FALSE
