\* Hunt: Scenario 4 (brief section 2), MC-4, replacement-BPOS path.  Operator refreshNamenodes
\* replaces the BPOS for the same bpid (rename, or remove then re-add: BlockPoolManager.java:175-292).
\* The new BPOS starts with bpServiceToActive == null, is registered by bpid on its first handshake
\* (DataNode.java:2185-2195), and W1 acknowledges only an ACTIVE handshake (BPOfferService.java:386-390).
\* A daemon accepted by the old BPOS looks up the bpid again at L602 and may get the new one.
\* Isolation: the pruning-only ACTION_CONSTRAINT S4IsolationGuide (MC.tla) forbids actor exits, so the
\* stopped old BPOS cannot fire through W2 (Scenario 2's mechanism, reported first by
\* MC_hunt_s4_refresh.cfg); any TargetSafe violation here goes through a replacement BPOS.
\* Topology: 2 NNs, HA, n1 ACTIVE at Init.  Budgets: MaxRefresh = 1 (two incarnations); others 0.
CONSTANTS
    NN = {n1, n2}
    HA = TRUE
    InitActive = n1
    None = None
    EnableAssertions = TRUE
    Inc <- MCInc
    Rec <- MCRec
    MaxRecoveries = 1
    MaxRefresh = 1   \* scenario budget
    MaxDemote = 0
    MaxPromote = 0
    MaxNNCrash = 0
    MaxEdits = 0
    MaxActorExit = 0
    MaxReplicaFail = 0

INIT MCInit
NEXT MCNext

INVARIANTS
    \* target (adhoc Shared Rule 1)
    TargetSafe
    \* structural sanity (brief section 5); cheap, and checked here under this Scenario's faults
    ActiveActorAlive
    HbCarriesSenderState

ACTION_CONSTRAINT
    S4IsolationGuide

CHECK_DEADLOCK FALSE
