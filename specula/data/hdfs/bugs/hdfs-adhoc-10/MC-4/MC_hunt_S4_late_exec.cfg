\* Scenario 4 / MC-4: one call fails at the client but stays with the JN, which
\* may run it later or drop it (TimeoutLate; JNExecLate, DropLate), single
\* writer, workload segments {1-3}, {4}.
\* Question: can a timed-out start still be pending when the next journal of
\* the same channel runs on the JN?
SPECIFICATION MCSpec

CONSTANTS
    JN = {j1, j2, j3}
    NumWriters = 1
    SegLen <- WorkloadSegLen
    W2Segs = 1
    LostOps = {"gjs", "ne", "start", "journal", "finalize", "prepare", "accept"}
    MaxLost = 0
    MaxCrash = 0
    MaxWCrash = 0
    MaxLate = 1
    MaxDisk = 0

SYMMETRY Symmetry

INVARIANTS
    TargetSafe

CHECK_DEADLOCK FALSE
