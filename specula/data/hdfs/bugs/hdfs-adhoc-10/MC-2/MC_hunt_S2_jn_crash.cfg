\* Scenario 2 / MC-2: one JN crash (Crash), restarts unbounded after it,
\* single writer, workload segments {1-3}, {4}.
\* Question: can a JN that is down for (or crashes before J:611 of) the
\* writer's start come back for the journal with the old lastWriterEpoch?
SPECIFICATION MCSpec

CONSTANTS
    JN = {j1, j2, j3}
    NumWriters = 1
    SegLen <- WorkloadSegLen
    W2Segs = 1
    LostOps = {"gjs", "ne", "start", "journal", "finalize", "prepare", "accept"}
    MaxLost = 0
    MaxCrash = 1
    MaxWCrash = 0
    MaxLate = 0
    MaxDisk = 0

SYMMETRY Symmetry

INVARIANTS
    TargetSafe

CHECK_DEADLOCK FALSE
