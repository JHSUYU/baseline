\* Scenario 3 / MC-3: writer 1 crashes once (WriterCrash); writer 2 takes over
\* (getJournalState, newEpoch, recovery, one segment); one newEpoch request
\* is lost (LoseRequest, LostOps = {ne}).
\* Question: can writer 2's start be rejected before J:611 by the J:588-603
\* existing-segment checks on a JN that kept writer 1's in-progress file,
\* so that writer 2's journal meets lastWriterEpoch = 1?
SPECIFICATION MCSpec

CONSTANTS
    JN = {j1, j2, j3}
    NumWriters = 2
    SegLen <- WorkloadSegLen
    W2Segs = 1
    LostOps = {"ne"}
    MaxLost = 1
    MaxCrash = 0
    MaxWCrash = 1
    MaxLate = 0
    MaxDisk = 0

SYMMETRY Symmetry

INVARIANTS
    TargetSafe

CHECK_DEADLOCK FALSE
