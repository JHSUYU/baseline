\* Scenario 1 / MC-1: one request lost before the JN runs it (LoseRequest,
\* LostOps = every op), single writer, workload segments {1-3}, {4}.
\* Question: can a lost startLogSegment leave lastWriterEpoch stale while
\* the segment's journal still reaches the JN (Journal.java:517-518)?
SPECIFICATION MCSpec

CONSTANTS
    JN = {j1, j2, j3}
    NumWriters = 1
    SegLen <- WorkloadSegLen
    W2Segs = 1
    LostOps = {"gjs", "ne", "start", "journal", "finalize", "prepare", "accept"}
    MaxLost = 1
    MaxCrash = 0
    MaxWCrash = 0
    MaxLate = 0
    MaxDisk = 0

SYMMETRY Symmetry

INVARIANTS
    TargetSafe

CHECK_DEADLOCK FALSE
