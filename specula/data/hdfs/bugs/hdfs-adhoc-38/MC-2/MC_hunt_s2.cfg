\* MC_hunt_s2.cfg: Scenario 2, re-parenting a non-lazy file under a LAZY_PERSIST
\* tagged directory by rename. Finding Q-S2.
\*
\* Only Scenario 2's budgets are set: three renames (old API and rename2), one
\* mkdir for the spare directory, and one directory policy operation that
\* TagOnlyNonAncestors = TRUE limits to a directory that is not, at that moment,
\* an ancestor of F. So the Scenario 1 route is closed and every firing needs a
\* rename after the tag. No file policy operation.
SPECIFICATION MCSpec

CONSTANTS
    CreateLazyFlag = FALSE
    CreatePolicyId = 0
    DefaultPolicy  = 7

    MaxDirPolicyOps     = 1
    MaxFilePolicyOps    = 0
    MaxRenames          = 3
    MaxMkdirs           = 1
    TagOnlyNonAncestors = TRUE

CONSTRAINT
    StopAfterTarget

INVARIANTS
    TargetSafe
    TypeOK
