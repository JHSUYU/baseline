\* MC_hunt_S3fed.cfg — Scenario 3 (brief §2, finding MC-3), removal variant on a federated
\* DataNode: ns1 -> NN n1 (pool p1) and ns2 -> NN n2 (pool p2) are configured at start; the
\* operator refreshes to {ns1}, so Step 4 stops BPOS(ns2) (BPM:242-251) and its cleanUp unmaps
\* p2 (DN:2152 -> BPM:94) while a recovery task for a p2 block may be in its window.
\* The recovering block is in p2 (RecPool = p2); n1's side is not modeled (it accepts all and
\* sends no modeled command). Only this Scenario's counter is raised: MaxRefresh = 1.

SPECIFICATION MCSpec

CONSTANTS
    ns1 = ns1
    ns2 = ns2
    n1 = n1
    n2 = n2
    p1 = p1
    p2 = p2
    Nil = Nil

    DN = {d1, d2}
    NS = {ns1, ns2}
    NN = {n1, n2}
    Pool = {p1, p2}
    NnOf <- NnOfFed
    PoolOf <- PoolOfFed
    InitCfg = {ns1, ns2}
    RefreshCfg = {ns1}
    RecPool = p2
    MaxAttempts = 2

    MaxDnStop = 0
    MaxNnReject = 0
    MaxCmdCrash = 0
    MaxNnRestart = 0
    MaxDnsFail = 0
    MaxRefresh = 1
    MaxLostCommits = 1

SYMMETRY Symmetry

CONSTRAINT StopAfterTarget

CHECK_DEADLOCK FALSE

INVARIANTS
    TargetSafe
