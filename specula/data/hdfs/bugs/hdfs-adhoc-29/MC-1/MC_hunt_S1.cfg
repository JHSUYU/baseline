\* MC_hunt_S1.cfg — Scenario 1 (brief §2, finding MC-1): the DataNode stops offering service
\* while a recovery task is between BRW:131 and BRW:602. DnStop(d, "volFail") models
\* handleDiskError (DN:2743, default failed.volumes.tolerated = 0); DnStop(d, "shutdown") models
\* DataNode.shutdown() (DN:2545, then DnShutdownInterrupt DN:2612/2655 and ActorStop DN:2664).
\* Every actor then exits and the last cleanUp unmaps the pool (BPOS:485-486 -> DN:2152 -> BPM:94).
\* Only this Scenario's counter is raised: MaxDnStop = 1 (one stop, either cause, on either DN).
\* Workload shape as in MC.cfg (MaxAttempts = 2, MaxLostCommits = 1).

SPECIFICATION MCSpec

CONSTANTS
    ns1 = ns1
    ns2 = ns2
    n1 = n1
    n2 = n2
    p1 = p1
    p2 = p2
    Nil = Nil

    DN = {d1, d2}
    NS = {ns1}
    NN = {n1}
    Pool = {p1}
    NnOf <- NnOfOne
    PoolOf <- PoolOfOne
    InitCfg = {ns1}
    RefreshCfg = {ns1}
    RecPool = p1
    MaxAttempts = 2

    MaxDnStop = 1
    MaxNnReject = 0
    MaxCmdCrash = 0
    MaxNnRestart = 0
    MaxDnsFail = 0
    MaxRefresh = 0
    MaxLostCommits = 1

SYMMETRY Symmetry

CONSTRAINT StopAfterTarget

CHECK_DEADLOCK FALSE

INVARIANTS
    TargetSafe
