\* MC_hunt_S2.cfg — Scenario 2 (brief §2, finding MC-2): a NameNode reply or a command failure
\* stops the pool's last actor while a recovery task is between BRW:131 and BRW:602.
\*   NnReject(d): heartbeat UnregisteredNodeException / DisallowedDatanodeException
\*     (NNRS:1777-1786, DM:1871-1874; operator: NN -upgrade/-format, include list + refreshNodes)
\*     -> BPSA:791-798 shouldServiceRun = false; also rejects a re-registration (DM:1213-1214).
\*   CmdThreadCrash(d, ns): an unchecked exception ends the CommandProcessingThread
\*     (BPSA:1412-1422, processCommand catches only RemoteException/IOException BPSA:1461-1472).
\* The pool's only actor (one NN, no HA) then exits; its cleanUp unmaps the pool (DN:2152).
\* Only this Scenario's counters are raised: MaxNnReject = 1, MaxCmdCrash = 1 (as the brief §4
\* proposes). The two-fault environment-only variant (NN restart + reverse-DNS failure) is
\* MC_hunt_S2env.cfg. Workload shape as in MC.cfg.

SPECIFICATION MCSpec

CONSTANTS
    ns1 = ns1
    ns2 = ns2
    n1 = n1
    n2 = n2
    p1 = p1
    p2 = p2
    Nil = Nil

    DN = {d1, d2}
    NS = {ns1}
    NN = {n1}
    Pool = {p1}
    NnOf <- NnOfOne
    PoolOf <- PoolOfOne
    InitCfg = {ns1}
    RefreshCfg = {ns1}
    RecPool = p1
    MaxAttempts = 2

    MaxDnStop = 0
    MaxNnReject = 1
    MaxCmdCrash = 1
    MaxNnRestart = 0
    MaxDnsFail = 0
    MaxRefresh = 0
    MaxLostCommits = 1

SYMMETRY Symmetry

CONSTRAINT StopAfterTarget

CHECK_DEADLOCK FALSE

INVARIANTS
    TargetSafe
