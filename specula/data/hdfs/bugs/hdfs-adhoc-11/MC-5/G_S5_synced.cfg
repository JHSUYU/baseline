\* Pruning-only variant of MC_hunt_S5_ha.cfg (spec/output/hunt/gated/MCGated.tla):
\*   no roll inside a registration RPC; safe mode entered only from a synced state.
\* Same SPECIFICATION and constants as MC_hunt_S5_ha.cfg except where marked; only removes behaviors.
\* Scenario 5 / MC-5 (LOW): HA. Each NN rolls its own key stream and DNs merge them.
\* A standby's pushes can be suppressed by safe mode; getDataEncryptionKey has no
\* operation check, so a standby (stale proxy) or observer answers it
\* (DekFromStandby); failover re-arms pushes but the new active issues DEKs at once.
\* Question: can a DEK from a failed-over or standby/observer NN, whose pushes
\* were suppressed, make phi_T true?
\* Scope: safe mode only on a STANDBY NN (SafeModeRoles), which keeps Scenario 1's
\* active-side path out of this hunt; and an NN issues DEKs only once every up DN
\* is registered with it (DekNeedsRegisteredDNs), which keeps the DN-startup
\* registration lag between the two NNs out. Set it FALSE to explore that lag
\* separately.
\* Counters: MaxRolls = 2 per NN, MaxSafeModeEnter = 1, MaxFailover = 1.
SPECIFICATION MCSpec

CONSTANTS
    NNs = {n1, n2}
    DNs = {d1}
    FirstActive = n1
    LateDNs = {}
    SplitRegistration = FALSE
    DekFromStandby = TRUE
    DnTransferOn = FALSE
    StartSafeModes = {"startup", "off"}
    Null = Null
    MaxRolls = 2
    MaxSafeModeEnter = 1
    MaxLostResp = 0
    MaxNNRestart = 0
    MaxDNRestart = 0
    MaxFailover = 1
    SafeModeRoles = {"standby"}
    LossRoles = {"active"}
    DekNeedsRegisteredDNs = TRUE
    MaxQueue = 2

CONSTRAINT
    QueueBound

ACTION_CONSTRAINT
    GuideSynced

INVARIANTS
    TargetSafe

CHECK_DEADLOCK FALSE
