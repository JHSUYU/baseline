\* Pruning-only variant of MC_hunt_S1_safemode.cfg (spec/output/hunt/gated/MCGated.tla):
\*   no roll inside a registration RPC; safe mode entered only from a synced state.
\* Same SPECIFICATION and constants as MC_hunt_S1_safemode.cfg except where marked; only removes behaviors.
\* Scenario 1 / MC-1 (HIGH): safe mode suppresses key pushes while rolls and
\* DEK issue continue (DatanodeManager.java:1882-1886 returns before :1971).
\* Question: can two interval rolls inside one safe-mode period make
\* allKeys.get(keyId) == null, with currentKey != null, for a fresh DEK at a DN
\* that was synced before safe mode?
\* Counters: MaxRolls = 2 (time), MaxSafeModeEnter = 1 (manual/resource-low
\* safe mode on the ACTIVE NN). Every other counter is 0.
SPECIFICATION MCSpec

CONSTANTS
    NNs = {n1}
    DNs = {d1}
    FirstActive = n1
    LateDNs = {}
    SplitRegistration = FALSE
    DekFromStandby = FALSE
    DnTransferOn = FALSE
    StartSafeModes = {"startup", "off"}
    Null = Null
    MaxRolls = 2
    MaxSafeModeEnter = 1
    MaxLostResp = 0
    MaxNNRestart = 0
    MaxDNRestart = 0
    MaxFailover = 0
    SafeModeRoles = {"active"}
    LossRoles = {"active"}
    DekNeedsRegisteredDNs = FALSE
    MaxQueue = 2

CONSTRAINT
    QueueBound

ACTION_CONSTRAINT
    GuideSynced

INVARIANTS
    TargetSafe

CHECK_DEADLOCK FALSE
