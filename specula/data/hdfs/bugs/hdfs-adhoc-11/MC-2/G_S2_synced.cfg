\* Pruning-only variant of MC_hunt_S2_lostpush.cfg (spec/output/hunt/gated/MCGated.tla):
\*   no roll inside a registration RPC (safe mode is not used: MaxSafeModeEnter = 0).
\* Same SPECIFICATION and constants as MC_hunt_S2_lostpush.cfg except where marked; only removes behaviors.
\* Scenario 2 / MC-2 (HIGH): the key push is at-most-once. needKeyUpdate is
\* cleared when the heartbeat reply is built (BlockManager.java:1674-1676); a
\* lost reply is not re-sent before the next roll's sweep.
\* Question: can one lost reply that carried a KeyUpdateCommand, then the next
\* roll, make phi_T true before the DN's next delivered heartbeat?
\* Counters: MaxRolls = 2 (time), MaxLostResp = 1 (a reply from the ACTIVE NN).
\* Every other counter is 0.
SPECIFICATION MCSpec

CONSTANTS
    NNs = {n1}
    DNs = {d1}
    FirstActive = n1
    LateDNs = {}
    SplitRegistration = FALSE
    DekFromStandby = FALSE
    DnTransferOn = FALSE
    StartSafeModes = {"startup", "off"}
    Null = Null
    MaxRolls = 2
    MaxSafeModeEnter = 0
    MaxLostResp = 1
    MaxNNRestart = 0
    MaxDNRestart = 0
    MaxFailover = 0
    SafeModeRoles = {"active"}
    LossRoles = {"active"}
    DekNeedsRegisteredDNs = FALSE
    MaxQueue = 2

CONSTRAINT
    QueueBound

ACTION_CONSTRAINT
    GuideSynced

INVARIANTS
    TargetSafe

CHECK_DEADLOCK FALSE
