\* Scenario 3 / MC-3 (MEDIUM): the registration export (DatanodeManager.java:1209)
\* precedes the heartbeat-set join (:1300 / :1332-1337); a roll and sweep in
\* between reach neither the snapshot nor the node.
\* Question: with no fault, can a (re-)registration whose export precedes a roll
\* and whose join follows the sweep make phi_T true after the next roll?
\* Topology: d1 synced from the start; d2 starts late (LateDNs) and registers
\* with the export and the join as two steps (SplitRegistration).
\* Counters: MaxRolls = 2 (time). No fault counter.
SPECIFICATION MCSpec

CONSTANTS
    NNs = {n1}
    DNs = {d1, d2}
    FirstActive = n1
    LateDNs = {d2}
    SplitRegistration = TRUE
    DekFromStandby = FALSE
    DnTransferOn = FALSE
    StartSafeModes = {"startup", "off"}
    Null = Null
    MaxRolls = 2
    MaxSafeModeEnter = 0
    MaxLostResp = 0
    MaxNNRestart = 0
    MaxDNRestart = 0
    MaxFailover = 0
    SafeModeRoles = {"active"}
    LossRoles = {"active"}
    DekNeedsRegisteredDNs = FALSE
    MaxQueue = 2

CONSTRAINT
    QueueBound

INVARIANTS
    TargetSafe

CHECK_DEADLOCK FALSE
