\* Pruning-only variant of MC_hunt_S4_restart.cfg (spec/output/hunt/gated/MCGated.tla):
\*   NN restart in steady state; target fired by a client DEK from the issuer's current incarnation.
\* Same SPECIFICATION and constants as MC_hunt_S4_restart.cfg except where marked; only removes behaviors.
\* Scenario 4 / MC-4 (MEDIUM): restarts replace key spaces. A restarted NN issues
\* keys from a fresh range that DNs learn only by re-registering; a restarted DN
\* knows only the current NN incarnation's keys.
\* Question: can an NN restart plus a DN restart (backward: an old-incarnation
\* id from a cached client DEK or from a not-yet-re-registered DN's
\* currentKey), or an NN restart with a DEK refreshed from the new incarnation
\* and cached locations (forward), make phi_T true?
\* Topology: 2 DNs with DN->DN transfers (DnTransferOn) for the DN-originated
\* variant. Counters: MaxNNRestart = 1, MaxDNRestart = 1, MaxRolls = 0.
SPECIFICATION MCSpec

CONSTANTS
    NNs = {n1}
    DNs = {d1, d2}
    FirstActive = n1
    LateDNs = {}
    SplitRegistration = FALSE
    DekFromStandby = FALSE
    DnTransferOn = FALSE   \* variant (parent: TRUE); DnTransfer steps are stutters unless they fire
    StartSafeModes = {"startup", "off"}
    Null = Null
    MaxRolls = 0
    MaxSafeModeEnter = 0
    MaxLostResp = 0
    MaxNNRestart = 1
    MaxDNRestart = 1
    MaxFailover = 0
    SafeModeRoles = {"active"}
    LossRoles = {"active"}
    DekNeedsRegisteredDNs = FALSE
    MaxQueue = 2

CONSTRAINT
    QueueBound

ACTION_CONSTRAINT
    GuideSteady

INVARIANTS
    TargetSafeForward   \* variant: its violation implies a TargetSafe violation

CHECK_DEADLOCK FALSE
