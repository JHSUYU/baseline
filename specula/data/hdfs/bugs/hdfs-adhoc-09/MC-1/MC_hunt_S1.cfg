\* Hunt for Scenario 1 (brief section 2, finding MC-S1): failover with swallowed read failures.
\* Only S1's mechanism is enabled: in-progress tailing by the standby (StandbyTail), and up to
\* two failed QJM reads while a read quorum is up (catch-up ELT:297-328 and the openForWrite
\* check FSEL:333-345, both swallowed by JS:276-282).  Writer 1 hands over by a clean close
\* (graceful failover, CloseWriter); no crash, partition, loss, rewind or power loss.
\* Smallest shape the brief predicts: W1 batches [1],[2..3], finalize(1,3) carries committed 3;
\* the standby tailed to 1; W2 starts at 2 -> MaxTxId = 3.
SPECIFICATION MCSpec
CONSTANTS
    JN = {j1, j2, j3}
    NoJN = NoJN
    NumWriters = 2
    MaxTxId = 3
    MaxBatch = 2
    InProgressTailing = TRUE
    LaunchModes = {"normal"}
    StandbyTail = TRUE
    ZombieWriters = FALSE
    PowerLossAfterRewind = FALSE
    PartitionInRollback = FALSE
    MaxQueue = 3
    MaxReadFail = 2
    MaxPowerLoss = 0
    MaxWCrash = 0
    MaxLate = 0
    MaxPartition = 0
    MaxJNCrash = 0
    MaxMsgLoss = 0
    MaxPurge = 0
    HistAdd <- MCHistAdd
SYMMETRY JNSymmetry
CONSTRAINT QueueBound
INVARIANTS
    TargetSafe
    TypeOK
    ReqFromSenderState
CHECK_DEADLOCK FALSE
