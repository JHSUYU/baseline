\* Hunt for Scenario 2(b) (finding MC-S2, late-request branch): writer 1 is stopped by a crash
\* that may leave one RPC on the wire (MaxWCrash = 1, MaxLate = 1); one JN host partition, started
\* while the rollback writer runs (PartitionInRollback), lets a JN miss that writer's epoch-2
\* RPCs before discardSegments, which needs every JN
\* (QJM:772-788), reaches it after the heal.  The late pre-rewind RPC may then re-raise that
\* JN's committed txid (J:486-510).  No power loss, JN crash, loss or read fault.
\* InProgressTailing = FALSE (the default): openForWrite's safety read then uses the streaming
\* path over the JNs' files (QJM:519-532), which OpenForWrite models.  With in-progress tailing
\* the read goes through getJournaledEdits, whose highestWrittenTxId and edits cache
\* discardSegments does not reset (J:746-792, J:1198-1202); that path is not modeled.  The
\* model reads InProgressTailing only in standby tailing, which this hunt disables.
SPECIFICATION MCSpec
CONSTANTS
    JN = {j1, j2, j3}
    NoJN = NoJN
    NumWriters = 2
    MaxTxId = 3
    MaxBatch = 2
    InProgressTailing = FALSE
    LaunchModes = {"rollback"}
    StandbyTail = FALSE
    ZombieWriters = FALSE
    PowerLossAfterRewind = FALSE
    PartitionInRollback = TRUE
    MaxQueue = 3
    MaxReadFail = 0
    MaxPowerLoss = 0
    MaxWCrash = 1
    MaxLate = 1
    MaxPartition = 1
    MaxJNCrash = 0
    MaxMsgLoss = 0
    MaxPurge = 0
    HistAdd <- MCHistAdd
SYMMETRY JNSymmetry
CONSTRAINT QueueBound
INVARIANTS
    TargetSafe
    TypeOK
    ReqFromSenderState
CHECK_DEADLOCK FALSE
