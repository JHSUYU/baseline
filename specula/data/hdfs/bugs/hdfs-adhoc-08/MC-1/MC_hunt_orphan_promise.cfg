\* MC_hunt_orphan_promise.cfg - Scenario 1 (brief §2, finding MC-1).
\* Epoch inversion from orphan promises: failed epoch attempts leave a promise
\* on a minority JN; a later writer reads a majority that excludes it, picks a
\* lower epoch, ignores that JN's newEpoch rejection, and sends it RequestInfo
\* RPCs (QJM:232-247, ALS:61-68, J:347-349, J:486).
\* Minimal trace (brief §2): writers A, B fail with newEpoch reaching only one JN
\* (via 2 losses each, or 1 stop each); writer C reads the other two JNs.
\* Only this Scenario's counters are set: loss and stop. Restart / upgrade /
\* rollback are 0. NoOverlap and DropOnStop exclude designed fencing D1-D3.

SPECIFICATION MCSpec

CONSTANTS
    JN = {j0, j1, j2}
    MaxWriters = 3
    ReqRounds = 1
    NoOverlap = TRUE
    DropOnStop = TRUE

    MaxLoss = 4
    MaxStops = 2
    MaxRestarts = 0
    MaxUpgrades = 0
    MaxRollbacks = 0
    StopInNewEpoch = TRUE

SYMMETRY Symmetry

INVARIANTS
    \* Oracle
    TargetSafe
    \* Structural sanity (brief §5; ad hoc Shared Rule 1 allows one or two)
    TypeOK
    ReqCarriesSenderEpoch

CHECK_DEADLOCK FALSE
