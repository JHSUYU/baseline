\* MC_hunt_dnstop.cfg: hunt for Scenario 3 (brief section 2; finding MC-3): the DataNode stops
\* (shouldRun = false) while the hot-swap worker is in its window; the actor polls shouldRun()
\* and exits on its own.  Both stop paths are in scope: "direct" (DN.shutdown, flag at DN:2545
\* before any DataNode-monitor use) and "gated" (one DataNode-monitor acquisition first:
\* shutdownDatanode RPC DN:3848, upgrade shutdown DN:2571 -> DN:1632, fatal disk error
\* DN:4084 -> DN:1405; flag at DN:2545 / DN:2595 / DN:2743).
\* Bounds (brief section 4): one pool, one new volume; at most one DataNode stop; every other
\* counter 0.  Invariants: TargetSafe and the two structural sanity invariants.
\* To examine the gated path alone, set DnStopModes = {"gated"} (see MC_probe_S3_gated.cfg).
SPECIFICATION MCSpec
CONSTANTS
    NS = {b1}
    Vols = {v1}
    Null = Null
    DnStopModes = {"direct", "gated"}
    MaxNNReject = 0
    MaxNsRemove = 0
    MaxDnStop = 1
INVARIANTS
    TargetSafe
    \* structural sanity (brief section 5; held over MC_sanity_struct.cfg's whole space)
    RemovalOnlyByShutdown
    BuilderKeysFromSnapshot
CHECK_DEADLOCK TRUE
