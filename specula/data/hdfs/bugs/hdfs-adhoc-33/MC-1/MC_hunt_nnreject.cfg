\* MC_hunt_nnreject.cfg: hunt for Scenario 1 (brief section 2; finding MC-1): the NameNode
\* rejects the DataNode (heartbeat path BPSA:791-799 or re-registration path BPSA:1461-1468),
\* the pool's only actor exits and DN.shutdownBlockPool removes its bpStorageMap entry
\* (DN:2168) between the worker's DS:340 and DS:254.
\* Bounds (brief section 4): the workload topology, one pool and one new volume; at most
\* one NN rejection; every other counter 0.  Invariants: TargetSafe and the two structural sanity
\* invariants.
SPECIFICATION MCSpec
CONSTANTS
    NS = {b1}
    Vols = {v1}
    Null = Null
    DnStopModes = {"direct", "gated"}
    MaxNNReject = 1
    MaxNsRemove = 0
    MaxDnStop = 0
INVARIANTS
    TargetSafe
    \* structural sanity (brief section 5; held over MC_sanity_struct.cfg's whole space)
    RemovalOnlyByShutdown
    BuilderKeysFromSnapshot
CHECK_DEADLOCK TRUE
