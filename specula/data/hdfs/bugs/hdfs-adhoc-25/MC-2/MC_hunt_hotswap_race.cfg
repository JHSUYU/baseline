\* Hunt: Scenario 2 (brief MC-S2) - concurrent hot-swap loads race on the
\* shared BlockPoolSliceStorage object. DISK only.
\*   d1, d2 configured and formatted at InitCT; d3 is an empty disk that is
\*   not configured. d2 can be detached (reconfiguration), miss a NameNode
\*   -upgrade, and be hot-added again together with d3 in one
\*   reconfiguration (two pool threads, DN:1312-1329). The question: can one
\*   thread's BPSS:388 write land between another thread's BPSS:405 read and
\*   its BPSS:184 read?
\* Only this Scenario's counters are set.
\*
\* Locations (config-file order): 1 = d1, 2 = d2, 3 = d3 (all DISK)
SPECIFICATION MCSpec

CONSTANTS
    n1 = n1

    Loc           = {1, 2, 3}
    ProvidedLoc   = {}
    InitConf      = {1, 2}
    InitFormatted = {1, 2}
    SwapLocs      = {2, 3}
    NN            = {n1}
    SwapWidth     = 2
    InitCT        = 0
    MaxCT         = 3

    MaxNNUpgrade  = 1
    MaxNNRollback = 0
    MaxDNRestart  = 1
    MaxFreshDisk  = 0
    MaxHotSwap    = 1
    MaxDetach     = 1

CHECK_DEADLOCK FALSE

CONSTRAINT
    StopAfterTarget

\* The target (the hunt's property)
INVARIANTS
    TargetSafe

\* Model honesty (brief Section 5 structural invariants; adhoc Shared Rule 1).
\* Both held over this model's whole state space when checked without TargetSafe.
INVARIANTS
    TypeOK
    CTimeProvenance
