\* Hunt: Scenario 3 (brief MC-S3) - leftover state or namespace-info drift
\* after the startup loop, met by a later PROVIDED load.
\*   Phase 3 revision (changelog Round 2): a DataNode supports one PROVIDED
\*   location (DS:150-156, FSD:446-453), and an HA upgrade or rollback moves
\*   both NameNodes (HDFSHighAvailabilityWithQJM.md:705-733). The only later
\*   PROVIDED load is then a hot add of the one PROVIDED location p1, which is
\*   not configured at startup. p1 is numbered first, so every configuration
\*   lists it first and the Scenario 1 startup order cannot occur.
\*   - Drift: two NameNodes (HA). An actor whose handshake comes after an HA
\*     upgrade or rollback replaces the cached nsInfo cTime without a reload
\*     (BPOS:245-262); the hot add uses that nsInfo (DN:1286-1289).
\*   - Leftover: a block-pool load that fails after BPSS:388 leaves its cTime
\*     in the shared object after the loop (d2 is empty at start, so a start
\*     after an upgrade formats it with no previous; after -rollback it fails
\*     at BPSS:421).
\*   - d3 (DISK, formatted at InitCT, not configured) can be hot-added in the
\*     same reconfiguration as p1 (two pool threads).
\* Only this Scenario's counters are set; detach and disk replacement are off.
\*
\* Locations (config-file order): 1 = p1 (PROVIDED, not configured),
\*   2 = d1 (DISK, configured, formatted), 3 = d2 (DISK, configured, empty),
\*   4 = d3 (DISK, not configured, formatted)
SPECIFICATION MCSpec

CONSTANTS
    n1 = n1
    n2 = n2

    Loc           = {1, 2, 3, 4}
    ProvidedLoc   = {1}
    InitConf      = {2, 3}
    InitFormatted = {2, 4}
    SwapLocs      = {1, 4}
    NN            = {n1, n2}
    SwapWidth     = 2
    InitCT        = 0
    MaxCT         = 3

    MaxNNUpgrade  = 1
    MaxNNRollback = 1
    MaxDNRestart  = 1
    MaxFreshDisk  = 0
    MaxHotSwap    = 1
    MaxDetach     = 0

CHECK_DEADLOCK FALSE

CONSTRAINT
    StopAfterTarget

\* The target (the hunt's property)
INVARIANTS
    TargetSafe

\* Model honesty (brief Section 5 structural invariants; adhoc Shared Rule 1).
INVARIANTS
    TypeOK
    CTimeProvenance
