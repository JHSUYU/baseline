\* Hunt: Scenario 1 (brief MC-S1) - a PROVIDED location is checked against
\* another location's leftover cTime in the startup loop.
\*   dfs.datanode.data.dir = [DISK]d1, [PROVIDED]p1 (documented order,
\*   HdfsProvidedStorage.md:82-85). Sources of the leftover value in the
\*   shared object at p1's BPSS:184:
\*   - NameNode -upgrade, DataNode (re)start: d1's block-pool upgrade is only
\*     queued (BPSS:414-417, 489-500), BPSS:388 left the old cTime;
\*   - NameNode -rollback after d1 was formatted during the upgrade window
\*     (disk replacement): d1 throws at BPSS:421 after BPSS:388 wrote the
\*     newer cTime.
\* Only this Scenario's counters are set; hot swap and second NameNode are off.
\*
\* Locations (config-file order): 1 = d1 (DISK, formatted), 2 = p1 (PROVIDED)
SPECIFICATION MCSpec

CONSTANTS
    n1 = n1

    Loc           = {1, 2}
    ProvidedLoc   = {2}
    InitConf      = {1, 2}
    InitFormatted = {1}
    SwapLocs      = {}
    NN            = {n1}
    SwapWidth     = 0
    InitCT        = 0
    MaxCT         = 3

    MaxNNUpgrade  = 1
    MaxNNRollback = 1
    MaxDNRestart  = 2
    MaxFreshDisk  = 1
    MaxHotSwap    = 0
    MaxDetach     = 0

CHECK_DEADLOCK FALSE

CONSTRAINT
    StopAfterTarget

\* The target (the hunt's property)
INVARIANTS
    TargetSafe

\* Model honesty (brief Section 5 structural invariants; adhoc Shared Rule 1).
\* Both held over this model's whole state space when checked without TargetSafe.
INVARIANTS
    TypeOK
    CTimeProvenance
