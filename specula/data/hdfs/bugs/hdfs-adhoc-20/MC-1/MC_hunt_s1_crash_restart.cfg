\* MC_hunt_s1_crash_restart.cfg -- brief Scenario 1 / finding MC-1.
\* "NN restart re-claims ACTIVE below its own advertised txid (non-HA, same
\* actor)": the NN advertises written-but-unsynced txids in heartbeats
\* (ClientEdit before SyncEdits), crashes (the tail beyond the recovered end is
\* lost), restarts ACTIVE at recovered+1 and heartbeats the actor that is still
\* bpServiceToActive (path P1).  Mechanism: RESTART + FAULT.
\* Topology = the workload (non-HA, one NN, one DN).  Scenario counters:
\* MaxCrash = 1; the workload's DN restart stays at 1; every other counter 0.

SPECIFICATION MCSpec

CONSTANTS
    NN        = {n1}
    HAEnabled = FALSE
    Null      = Null

    \* workload size
    MaxTxid         = 5
    MaxDNRestart    = 1

    \* Scenario 1 counters
    MaxCrash        = 1

    \* not used by Scenario 1
    MaxCleanRestart = 0
    MaxFailover     = 0
    MaxDepose       = 0
    MaxRefresh      = 0
    MaxActorDeath   = 0
    MaxPartition    = 0

CHECK_DEADLOCK FALSE

INVARIANT TargetSafe
