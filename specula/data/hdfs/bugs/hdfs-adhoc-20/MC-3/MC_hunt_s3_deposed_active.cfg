\* MC_hunt_s3_deposed_active.cfg -- brief Scenario 3 / finding MC-3.
\* "Deposed active (split brain) reaches :615 through the handshake": a
\* deposed NN keeps reporting ACTIVE with a frozen lower txid; the heartbeat
\* path rejects it (:591-598) but, once B is null, a fresh actor's handshake
\* installs it with no txid check (:386-390) and its first heartbeat is
\* checked at :615 against the newer active's L.  No crash.  A fenced NN may
\* still advertise (ClientEdit) until its next journal write terminates it.
\* Mechanism: COMBINED (FAULT + INTERLEAVING).
\* Scenario counters (brief §2 S3): depose 1, failover 1, refresh 1, actor
\* death 1, partition 1; every other counter 0 (MaxCrash = 0).

SPECIFICATION MCSpec

CONSTANTS
    NN        = {n1, n2}
    HAEnabled = TRUE
    Null      = Null

    \* workload size
    MaxTxid         = 6

    \* Scenario 3 counters
    MaxDepose       = 1
    MaxFailover     = 1
    MaxRefresh      = 1
    MaxActorDeath   = 1
    MaxPartition    = 1

    \* not used by Scenario 3
    MaxCrash        = 0
    MaxCleanRestart = 0
    MaxDNRestart    = 0

SYMMETRY Symmetry

CHECK_DEADLOCK FALSE

INVARIANT TargetSafe
