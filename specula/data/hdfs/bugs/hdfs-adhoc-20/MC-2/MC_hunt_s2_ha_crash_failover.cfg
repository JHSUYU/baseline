\* MC_hunt_s2_ha_crash_failover.cfg -- brief Scenario 2 / finding MC-2.
\* "HA failover around an NN crash that lost advertised txids": the active NN
\* advertises unsynced txids and crashes; the next active (the other NN, or
\* the restarted one made ACTIVE again) starts at recovered+1.  DN paths:
\*   P1  the restarted NN regains ACTIVE before its actor sees STANDBY;
\*   P2  B became null (relinquish at :611 or actor death at :480) and a
\*       fresh/delayed actor's handshake installs the new active without a
\*       txid check (:386-390) while L is inherited.
\* Mechanism: COMBINED (FAULT + RESTART + INTERLEAVING).  The counterexample's
\* DN path (P1 or P2) must be reported.
\* Scenario counters (brief §2 S2): crash 1, failover 2, refresh 1, actor
\* death 1, partition 1; every other counter 0.

SPECIFICATION MCSpec

CONSTANTS
    NN        = {n1, n2}
    HAEnabled = TRUE
    Null      = Null

    \* workload size
    MaxTxid         = 7

    \* Scenario 2 counters
    MaxCrash        = 1
    MaxFailover     = 2
    MaxRefresh      = 1
    MaxActorDeath   = 1
    MaxPartition    = 1

    \* not used by Scenario 2
    MaxDepose       = 0
    MaxCleanRestart = 0
    MaxDNRestart    = 0

SYMMETRY Symmetry

CHECK_DEADLOCK FALSE

INVARIANT TargetSafe
