\* Mechanism found while running the sec. 2 sanity checks (not in the brief):
\* a recovery call queued behind a slow call on one channel is dispatched
\* after the new writer's first write quorum, so createReqInfo (ILC 287-291,
\* 541-546) binds the writer's new committedTxId (= recovered end + 1, set on
\* every channel by ALS 75-79), checkRequest stores it (J 503-511), and the
\* guard compares it with the slow JN's older, longer copy of the recovered
\* segment (J 906, 924-925).
\* No counted fault: writer failover (NW = 2) plus asynchrony only.
\* RecoveryCallsCarryNoC = FALSE (the filter is what removes this mechanism).
\* Sanity run (same bounds, 24 workers): TargetSafe violated at depth 73.
SPECIFICATION MCSpec

CONSTANTS
    JN = {j0, j1, j2}
    NoJN = NoJN
    NW = 2
    MaxTxId = 2
    AssertsEnabled = TRUE
    ConnectRetry = TRUE

    MaxJNCrash = 0
    MaxDrop = 0
    MaxLate = 0
    MaxLoseReply = 0
    MaxReject = 0
    MaxAcceptCrash = 0
    MaxWCrash = 0
    MaxPurge = 0

    MaxBatch = 2
    ConcurrentWriters = TRUE
    AllowRoll = FALSE
    RecoveryCallsCarryNoC = FALSE

SYMMETRY JNSymmetry

INVARIANTS
    TargetSafe

CHECK_DEADLOCK FALSE
