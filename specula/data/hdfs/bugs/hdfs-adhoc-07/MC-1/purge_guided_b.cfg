\* Scenario 1 (brief sec. 2, finding MC-1): purge marks a restarted JN's open
\* segment .stale (FJM 199-224: currentInProgress is null after restart), with
\* the purge's committedTxId bound at dispatch (ILC 287-291, 499-504).
\* Counters: JN crash (the forgetting JN restarts; another JN may be down) and
\* one checkpoint purge (MC.PurgeOk).  Everything else 0.  The brief suggested
\* MaxDrop = 1 as well; neither interleaving in brief sec. 2 needs a lost call
\* (a down JN refuses connections for free, RpcConnectFail), so MaxDrop = 0
\* here keeps the run tractable; MaxDrop = 1 is the follow-up if this is clean.
\* MaxBatch = 1: with MaxTxId = 2 the header rule already forces 1-txn batches.
\* RecoveryCallsCarryNoC = TRUE isolates this Scenario from the late-accept
\* mechanism (MC_hunt_late_accept.cfg).  ConnectRetry = TRUE: production
\* connect retries (10 x 1 s) let a call dispatched to a down JN run after it
\* restarts (analysis-report F1, independent confirmation).
\* Candidate interleaving (brief sec. 2): about 70 steps in this model.
\* Spec-generation smoke test: plain BFS reached depth 45 (23.7 M states) in
\* 17 min without a violation.  With the pruning-only constraint
\* GuideScenario1 (output/guided_purge_restart/MCGuided.tla) TLC found a
\* TargetSafe violation at depth 69: the brief's second (independent-
\* confirmation) interleaving.  See brief-coverage.md sec. 5.
SPECIFICATION MCSpec

CONSTANTS
    JN = {j0, j1, j2}
    NoJN = NoJN
    NW = 2
    MaxTxId = 2
    AssertsEnabled = TRUE
    ConnectRetry = TRUE

    MaxJNCrash = 2
    MaxDrop = 0
    MaxLate = 0
    MaxLoseReply = 0
    MaxReject = 0
    MaxAcceptCrash = 0
    MaxWCrash = 0
    MaxPurge = 1

    MaxBatch = 1
    ConcurrentWriters = TRUE
    AllowRoll = FALSE
    RecoveryCallsCarryNoC = TRUE

SYMMETRY JNSymmetry

INVARIANTS
    TargetSafe

CONSTRAINT GuideScenario1 GuideAllUp
CHECK_DEADLOCK FALSE
