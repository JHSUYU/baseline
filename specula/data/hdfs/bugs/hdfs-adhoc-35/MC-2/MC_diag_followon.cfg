\* MC_diag_followon.cfg -- the persisted follow-on of Scenario 1 (brief §2): the race makes a
\* pre-federation worker take the regular branch and write layoutVersion=-57 with an empty
\* clusterID; after a restart the startup main loop reads it and DS:750 fires.  Same
\* bounds as MC_hunt_hotswap.cfg; TargetSafe is replaced by NotFiredByMain (violated iff
\* the main loop fires).  Expected: violated.
SPECIFICATION MCSpec

CONSTANTS
    Loc          = {"p1", "d1", "a1", "b1"}
    ProvLocs     = {"p1"}
    InitNone     = {"b1"}
    InitPre      = {"a1"}
    InitPreCid   = {}
    InitOld      = {}
    InitCur      = {"d1"}
    InitForeign  = {}
    StartDirs    = {"d1", "p1"}
    SwapCands    = {"d1", "a1", "b1"}
    StartOpts    = {"REGULAR"}
    NnCid        = "C"
    HsNsChoices  = {"C"}
    VolTolerated = 1
    RetryInit    = FALSE
    HotSwapWidth = 2

    MaxDiskFail       = 1
    MaxHotSwapBatches = 1
    MaxDnRestarts     = 1
    MaxInitInterrupts = 0
    MaxBpssFail       = 0

INVARIANTS
    NotFiredByMain

CONSTRAINT StopAfterTarget

CHECK_DEADLOCK FALSE
