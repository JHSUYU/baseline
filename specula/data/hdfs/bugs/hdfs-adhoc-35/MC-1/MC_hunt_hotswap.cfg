\* MC_hunt_hotswap.cfg -- Scenario 1 (brief §2): parallel hot-swap workers on a DataStorage
\* whose shared clusterID was never set.  Finding MC-1.
\*   Locations: p1 PROVIDED; d1 the DataNode's DISK volume (current layout), so
\*   dfs.datanode.data.dir = [DISK]d1,[PROVIDED]p1, the documented PROVIDED layout
\*   (HdfsProvidedStorage.md:83-84); a1 a genuine 0.20/1.x pre-federation directory
\*   (precondition (i)); b1 an empty new directory (format path).
\*   Precondition (ii) route: d1 fails at startup (MaxDiskFail = 1, VolumeIOFailure)
\*   and dfs.datanode.failed.volumes.tolerated = 1 (FSD:320-343), so the DataNode runs
\*   on p1 only with clusterID "".  The hot swap may re-add d1 (DN:1204-1231); d1's load
\*   then fails at DS:667-671 (the DataNode generated a new datanodeUuid), but only after its
\*   DS:631 and DS:635 wrote the shared fields.
\*   One reconfiguration batch of up to 2 new locations (I-1); one restart for the
\*   persisted follow-on.  Interrupts, rollback and BPSS failures are off (Scenario 2).
\*   The PROVIDED-only data.dir route of precondition (ii) is MC_diag_hotswap_provonly.cfg.
SPECIFICATION MCSpec

CONSTANTS
    Loc          = {"p1", "d1", "a1", "b1"}
    ProvLocs     = {"p1"}
    InitNone     = {"b1"}
    InitPre      = {"a1"}
    InitPreCid   = {}
    InitOld      = {}
    InitCur      = {"d1"}
    InitForeign  = {}
    StartDirs    = {"d1", "p1"}
    SwapCands    = {"d1", "a1", "b1"}
    StartOpts    = {"REGULAR"}
    NnCid        = "C"
    HsNsChoices  = {"C"}
    VolTolerated = 1
    RetryInit    = FALSE
    HotSwapWidth = 2

    MaxDiskFail       = 1
    MaxHotSwapBatches = 1
    MaxDnRestarts     = 1
    MaxInitInterrupts = 0
    MaxBpssFail       = 0

INVARIANTS
    TargetSafe
\* structural sanity (brief §5; held over this whole state space in the Phase 2
\* smoke run, so a violation here means a spec bug, not a finding)
    MCTypeOK
    NoInventedCid

CONSTRAINT StopAfterTarget

CHECK_DEADLOCK FALSE
