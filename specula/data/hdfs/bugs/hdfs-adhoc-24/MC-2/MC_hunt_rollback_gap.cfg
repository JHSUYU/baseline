\* Scenario 2 (MC-2): a slice carrying the upgraded cTime survives the NN rollback (formatted in the upgrade window, offline during the -rollback start, or DN crash inside doRollback).
\* Hunt config (adhoc tla-patterns.md section 3): TargetSafe enabled; only this Scenario's
\* counters are non-zero (the workload's NN -upgrade and DN starts are needed by every Scenario).
SPECIFICATION MCSpec

CONSTANTS
    Vol = {v1, v2}
    InitLVs <- MCInitLVsCur

    MaxDNStarts     = 3
    MaxDNCrashes    = 1
    MaxNNUpgrades   = 1
    MaxClockFaults  = 0
    MaxNNRollbacks  = 1
    MaxNNFinalizes  = 0
    MaxCTimeRegress = 0
    MaxOffline      = 1
    MaxAttach       = 1
    MaxHotSwaps     = 1
    MaxRUStarts     = 0
    MaxRUFinalizes  = 0
    MaxCheckpoints  = 0
    MaxNNRestarts   = 0

SYMMETRY MCSymmetry

\* stop after the target fired (adhoc tla-patterns.md section 1)
CONSTRAINT StopAfterTarget

INVARIANTS
    TargetSafe
    \* structural sanity (adhoc Shared Rule 1): the fault actions of this Scenario keep types and cTime provenance
    TypeOK
    CTimeProvenance

CHECK_DEADLOCK FALSE
