\* Scenario 3 (MC-3): a stale rolling-upgrade marker plus a replayed finalized RU status delete a regular upgrade's previous before its rollback.
\* Hunt config (adhoc tla-patterns.md section 3): TargetSafe enabled; only this Scenario's
\* counters are non-zero (the workload's NN -upgrade and DN starts are needed by every Scenario).
SPECIFICATION MCSpec

CONSTANTS
    Vol = {v1, v2}
    InitLVs <- MCInitLVsCur

    MaxDNStarts     = 3
    MaxDNCrashes    = 0
    MaxNNUpgrades   = 1
    MaxClockFaults  = 0
    MaxNNRollbacks  = 1
    MaxNNFinalizes  = 0
    MaxCTimeRegress = 0
    MaxOffline      = 0
    MaxAttach       = 0
    MaxHotSwaps     = 0
    MaxRUStarts     = 1
    MaxRUFinalizes  = 1
    MaxCheckpoints  = 1
    MaxNNRestarts   = 1

SYMMETRY MCSymmetry

\* stop after the target fired (adhoc tla-patterns.md section 1)
CONSTRAINT StopAfterTarget

INVARIANTS
    TargetSafe
    \* structural sanity (adhoc Shared Rule 1): the fault actions of this Scenario keep types and cTime provenance
    TypeOK
    CTimeProvenance

CHECK_DEADLOCK FALSE
