\* Scenario 4 (MC-4): the NN reports a cTime below one the DN volumes adopted, without a rollback (clock behind an earlier cTime at the second upgrade, or the directory split abstracted as NNCTimeRegress).
\* Hunt config (adhoc tla-patterns.md section 3): TargetSafe enabled; only this Scenario's
\* counters are non-zero (the workload's NN -upgrade and DN starts are needed by every Scenario).
SPECIFICATION MCSpec

CONSTANTS
    Vol = {v1}
    InitLVs <- MCInitLVsCur

    MaxDNStarts     = 3
    MaxDNCrashes    = 0
    MaxNNUpgrades   = 2
    MaxClockFaults  = 1
    MaxNNRollbacks  = 0
    MaxNNFinalizes  = 1
    MaxCTimeRegress = 1
    MaxOffline      = 0
    MaxAttach       = 0
    MaxHotSwaps     = 0
    MaxRUStarts     = 0
    MaxRUFinalizes  = 0
    MaxCheckpoints  = 0
    MaxNNRestarts   = 0

SYMMETRY MCSymmetry

\* stop after the target fired (adhoc tla-patterns.md section 1)
CONSTRAINT StopAfterTarget

INVARIANTS
    TargetSafe
    \* structural sanity (adhoc Shared Rule 1): the fault actions of this Scenario keep types and cTime provenance
    TypeOK
    CTimeProvenance

CHECK_DEADLOCK FALSE
