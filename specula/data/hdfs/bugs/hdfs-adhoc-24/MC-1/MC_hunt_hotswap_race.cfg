\* Scenario 1 (MC-1): concurrent hot-swap loaders tear the shared guard operands (memLV/memC). Three volumes: one keeps the DN up, two are re-added concurrently; initial slices may be at OldLV (case b); cTime lag comes from the NN upgrade while a disk is offline (case a).
\* Hunt config (adhoc tla-patterns.md section 3): TargetSafe enabled; only this Scenario's
\* counters are non-zero (the workload's NN -upgrade and DN starts are needed by every Scenario).
SPECIFICATION MCSpec

CONSTANTS
    Vol = {v1, v2, v3}
    InitLVs <- MCInitLVsAll

    MaxDNStarts     = 1
    MaxDNCrashes    = 0
    MaxNNUpgrades   = 1
    MaxClockFaults  = 0
    MaxNNRollbacks  = 0
    MaxNNFinalizes  = 0
    MaxCTimeRegress = 0
    MaxOffline      = 2
    MaxAttach       = 1
    MaxHotSwaps     = 1
    MaxRUStarts     = 0
    MaxRUFinalizes  = 0
    MaxCheckpoints  = 0
    MaxNNRestarts   = 0

SYMMETRY MCSymmetry

\* stop after the target fired (adhoc tla-patterns.md section 1)
CONSTRAINT StopAfterTarget

INVARIANTS
    TargetSafe
    \* structural sanity (adhoc Shared Rule 1): the fault actions of this Scenario keep types and cTime provenance
    TypeOK
    CTimeProvenance

CHECK_DEADLOCK FALSE
