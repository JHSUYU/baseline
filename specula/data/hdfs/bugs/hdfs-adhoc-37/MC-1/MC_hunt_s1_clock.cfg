\* Hunt: Scenario 1 (brief MC-1) - clock-ordered cTime inversion between a
\* legacy snapshot and a pinned NameNode stamp.
\* Only this Scenario's counter is set: MaxClockSkew = 1 lets ONE NameNode
\* stamp (format or -upgrade) take a value of SkewCT, i.e. a clock reading at
\* or below the legacy cTimes; every other fault counter is 0.
\*
\* Shape (hadoop-22-dfs-dir.tgz, brief Section 2 Evidence): the legacy
\* DataNode cTime equals the legacy NameNode cTime (2); location 2 also holds
\* a legacy-era previous/ (LV -7 = "ancient", cTime 1). Pinned-era stamps
\* start at 3. SkewCT = {0, 1, 2}: below both legacy cTimes, between them, and
\* equal to the snapshot cTime (the guard is "<=").
\* Two routes are open: a system-created snapshot (REGULAR start after the
\* NameNode -upgrade, then -rollback), and the legacy-era previous/ judged by
\* a -rollback start before any REGULAR start.
\*
\* Locations: 1 = legacy current/ (cTime 2); 2 = legacy current/ (cTime 2)
\* plus previous/ (ancient, cTime 1).
SPECIFICATION MCSpec

CONSTANTS
    Dir          = {1, 2}
    Ns1NN        = {"n1"}
    Ns2NN        = {}
    ActiveNN     = {"n1"}
    LegacyNN     = "n1"
    DirCtA       = 2
    DirCtB       = 2
    InitPrevDirs = {2}
    InitPrevLv   = "ancient"
    InitPrevCt   = 1
    InitNnCt     = 2
    FirstStamp   = 3
    MaxCT        = 5

    \* operator bounds
    MaxNnUpgrade  = 2
    MaxNnRollback = 1
    MaxDnStart    = 3

    \* Scenario 1 counter
    MaxClockSkew       = 1
    SkewCT             = {0, 1, 2}

    \* other Scenarios' counters: 0
    MaxDirLoadFail     = 0
    MaxSkipRebootstrap = 0
    MaxDnCrash         = 0
    MaxRace            = 0
    MaxFixture         = 0

CHECK_DEADLOCK FALSE

CONSTRAINT
    StopAfterTarget

\* The target (the hunt's property)
INVARIANTS
    TargetSafe

\* Model honesty (brief Section 5 structural invariants; adhoc Shared Rule 1)
INVARIANTS
    TypeOK
    NsInfoSound
