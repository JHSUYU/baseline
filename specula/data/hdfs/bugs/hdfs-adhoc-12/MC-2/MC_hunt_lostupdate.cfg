\* MC_hunt_lostupdate.cfg (hdfs-adhoc-12)
\* Scenario 2 (brief 6.1 MC-2): one KeyUpdateCommand reply lost at the target.
\* Sets only MaxLostResponses = 1 with LossyDNs = {t}: losses only at the target.
\* A lost export at one rotation matters after the next one.
\* Bounds (brief 3.1 hunt table): DN = {s, t} (s = source, t = verifier), I = 2,
\* L = 1, MaxTime = 10, at most 2 concurrent token operations (XferIds = {1, 2}).
\* A rotation is possible once now - lastRot >= I and due when > I (changelog
\* Round 1), so rotations fall every 2 or 3 ticks: at most 5 by MaxTime = 10,
\* at least 3 (ticks 3, 6, 9).  Every counter not named above
\* is 0.
\* Realism guide (changelog, Bug Hunting): HbInRotationGap = FALSE, no heartbeat
\* is handled in the microsecond gap between a rotation (HBM:552) and its marking
\* loop (HBM:553-557).  It only removes behaviors.
SPECIFICATION MCSpec

CONSTANTS
    DN = {s, t}
    XferIds = {1, 2}
    I = 2
    L = 1
    MaxTime = 10
    SerialStart = 0
    KeyBase = 100
    MaxEpoch = 2
    Sources = {s}
    Targets = {t}
    LossyDNs = {t}
    StallDNs = {}
    DeadDNs = {}
    RestartDNs = {}
    ClientOps = FALSE
    TestActions = FALSE
    MaxSafeModeEpisodes = 0
    MaxLostResponses = 1
    MaxCPTStalls = 0
    MaxDeadRejoins = 0
    MaxNNRestarts = 0
    MaxDNRestarts = 0
    SafeModeMaxRotations = 100
    HbInRotationGap = FALSE
    HbRaceIsolation = FALSE

INVARIANTS
    TargetSafe

CHECK_DEADLOCK FALSE
