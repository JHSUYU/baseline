\* Hunt config: Scenario 1 (MC-1): a DataNode misses an NN rollback, then a re-upgrade snapshots its abandoned epoch.
\* One DataNode outage across a rollback window (MCDNOutage); two NN upgrade cycles.
\* Only this Scenario's counter is raised; every other counter is 0.
SPECIFICATION MCSpec

