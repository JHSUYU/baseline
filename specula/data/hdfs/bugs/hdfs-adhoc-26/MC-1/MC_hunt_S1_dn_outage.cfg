    NumVols = 2
    MaxCT = 9
    FormatCT = 2
    Tolerated = 0
    MaxUpgrades = 2
    MaxDNOutages = 1
    MaxVolOutages = 0
    MaxVolReplacements = 0
    MaxSwUpgrades = 0
    MaxClockSkews = 0

CHECK_DEADLOCK FALSE

INVARIANTS
    TargetSafe
