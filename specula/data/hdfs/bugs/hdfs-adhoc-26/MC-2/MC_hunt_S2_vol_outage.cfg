\* Hunt config: Scenario 2 (MC-2): a volume misses the DataNode's rollback start while the DataNode comes up.
\* One volume fault (MCVolOutage, or MCVolBpFault for the BP-load variant); dfs.datanode.failed.volumes.tolerated = 1 (with 0 the DataNode cannot start, which is Scenario 1).
\* Only this Scenario's counter is raised; every other counter is 0.
SPECIFICATION MCSpec

CONSTANTS
    DN = {"dn0"}
    NumVols = 2
    MaxCT = 9
    FormatCT = 2
    Tolerated = 1
    MaxUpgrades = 2
    MaxDNOutages = 0
    MaxVolOutages = 1
    MaxVolReplacements = 0
    MaxSwUpgrades = 0
    MaxClockSkews = 0

CHECK_DEADLOCK FALSE

INVARIANTS
    TargetSafe
