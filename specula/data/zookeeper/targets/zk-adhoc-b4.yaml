  jvm_properties: -Dzookeeper.enforceQuota=true
  maven_profile: full-build
scope_hint:
  - org.apache.zookeeper.retry.ZooKeeperRetry
  - org.apache.zookeeper.server.PrepRequestProcessor
  - org.apache.zookeeper.server.ZooKeeperServer
  - org.apache.zookeeper.server.DataTree
build:
  env: /set/by/run-case.sh
  prepare: "mvn -B install -DskipTests -Dmaven.javadoc.skip=true -Pfull-build   (already done once)"
  test_command: "mvn -B -o test -Pfull-build -pl zookeeper-contrib/zookeeper-contrib-zooinspector -Dtest='<Class>#<method>' -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false"
