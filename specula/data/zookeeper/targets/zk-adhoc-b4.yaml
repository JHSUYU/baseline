id: zk-adhoc-b4
system: Apache ZooKeeper
source_tree: /set/by/run-case.sh
base_commit: eab16599
check:
  file: zookeeper-server/src/main/java/org/apache/zookeeper/server/ZooKeeperServer.java
  line: 2201
  method: ZooKeeperServer.checkQuota(String, long, long, String)
  thrown: org.apache.zookeeper.KeeperException.QuotaExceededException
  guard: "checkCountQuota && newCount > countLimit && isCountHardLimit   (newCount = currentStats.getCount() + countDiff)"
workload:
  module: zookeeper-contrib/zookeeper-contrib-zooinspector
  test: org.apache.zookeeper.retry.TestAdhocWorkloadB4#run
