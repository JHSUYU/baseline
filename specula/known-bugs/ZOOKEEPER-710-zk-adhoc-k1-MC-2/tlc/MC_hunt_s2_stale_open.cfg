\* Scenario 2 (brief MC-2): one abandoned session open, processed at the leader
\* after a newer open, overwrites the owner of the client's only live connection.
\* Only the Scenario 2 counter is set (MaxAbandon = 1); MaxSyncs = 0.
\* Bounds per brief: 2 followers, <= 3 client ops.
SPECIFICATION MCSpec

CONSTANTS
    Leader = L
    Followers = {f1, f2}
    None = None
    Me = Me

    MaxOpens = 3
    MaxOps = 3
    MaxSyncs = 0
    MaxAbandon = 1

SYMMETRY Symmetry

INVARIANTS
    TargetSafe
    MCTypeOK
    OwnerProvenance

CHECK_DEADLOCK FALSE
