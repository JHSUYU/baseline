\* Hunt S1 (MC1): Balancer DEK outlives its BlockKey. No faults; time only (MaxTime ~ 4I+L). Client off: S1 is about the Balancer's mint-once DEK.
SPECIFICATION MCSpec
CHECK_DEADLOCK FALSE
SYMMETRY DNSymmetry

CONSTANTS
    d1 = d1
    d2 = d2
    DNs = {d1, d2}
    c1 = c1
    Clients = {c1}
    None = None
    I = 2
    L = 2
    KeyIdBase = 10
    InitLastRoll = {0}
    BalPollPeriod = 1
    MaxTime = 10
    MaxInFlight = 1
    BalancerEnabled = TRUE
    ClientEnabled = FALSE
    DNTransferEnabled = TRUE
    LossLimit = 0
    DeadLimit = 0
    SafeModeLimit = 0
    NNRestartLimit = 0
    DNRestartLimit = 0

INVARIANTS
    TargetSafe
    NNKeysWellFormed
    KeysOriginateAtNN
