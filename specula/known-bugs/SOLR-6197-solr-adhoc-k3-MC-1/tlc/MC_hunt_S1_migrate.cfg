\* Hunt Scenario 1 / MC-1: MIGRATE's hand-rolled temp-replica CREATE
\* (OCP:1895-1905) in non-legacy mode, on the workload path.
\* legacyCloud=false was applied through CLUSTERPROP before the workload
\* (InitLegacyCloud); no concurrent flips.  Scenario 1 uses no fault counter.
\* Includes the waitForCoreNodeName NPE masking branch (OCP:1578-1581) through
\* the OCP's lagging view (OverseerWatchRefresh is reactive, unbounded).
SPECIFICATION MCSpec

CONSTANTS
    Workload         <- WL_Workload
    InitLegacyCloud  = "false"
    FlipValues       = {}
    MaxPropFlips     = 0
    MaxCheckTimeouts = 0

VIEW MCView
ALIAS MCAlias
CHECK_DEADLOCK FALSE

INVARIANTS
    MCTypeOK
    CNNMatchesPreRegistration
    NoCreateBeforeCollectionExists
    TargetSafe
