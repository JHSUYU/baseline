\* MC_hunt_s1_start_failure.cfg - brief Scenario 1 / finding MC-1.
\* A journal start failure after a successful end-of-segment (roll or saveNamespace
\* finally) leaves BETWEEN_LOG_SEGMENTS without terminating; can a later admitted
\* roll enter endCurrentLogSegment? Counters set: only S1 ones (journal fault and
\* repair, rolls, client edits racing the next roll, safe-mode interposition,
\* saveNamespace). Lifecycle / HA / roller counters are 0.
SPECIFICATION MCSpec

CONSTANTS
    j1 = j1
    Journal = {j1}
    Required = {}
    MinRedundant = 1
    AsyncMode = TRUE
    HAEnabled = FALSE
    RollerFires = FALSE

    MaxRpcRolls = 2
    MaxRollerChecks = 0
    MaxClientEdits = 2
    MaxJournalFaults = 1
    MaxJournalRepairs = 1
    MaxSafeModeEnters = 1
    MaxSafeModeLeaves = 1
    MaxSaveNamespace = 1
    MaxStops = 0
    MaxStandby = 0

INVARIANT TargetSafe
INVARIANT TypeOK
INVARIANT SegmentHasStream

CHECK_DEADLOCK FALSE
