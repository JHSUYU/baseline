\* Hunt S3 / MC3: propagation lag of a freshly rolled key; no faults. Counts checks at a subscribed non-master validator that has not yet applied a published (or about-to-be-published) key.
SPECIFICATION MCSpec

CONSTANTS
    n1 = n1
    n2 = n2
    None = None
    Node = {n1, n2}

    KeyInterval   = 1
    TokenLifetime = 2
    MaxSkew       = 0
    Inf           = 99

    MaxTime    = 2
    MaxTokens  = 1
    MaxCrash   = 0
    MaxExpire  = 0
    MaxZkFail  = 0
    MaxStop    = 0
    MaxRestart = 0
    QuiescentTick = TRUE
    TargetFilter  = "S3"

SYMMETRY Symmetry

CHECK_DEADLOCK FALSE

INVARIANTS
    TargetSafe
    TokenFromHeldKey
    MasterHoldsCurrent
