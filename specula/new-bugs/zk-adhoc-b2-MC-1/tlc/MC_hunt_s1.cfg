\* MC_hunt_s1.cfg -- Scenario S1 "peer withdrawal inside a listing window"
\* (modeling-brief.md section 2, finding MC-1).
\* Question: with one participant still before/inside start() when a peer
\* begins stop(), can the peer's delete (LES:155 -> DT:534-627) be served between
\* a getChildren that listed the offer (LES:199) and the getData on it
\* (LES:310 -> FRP:672-674)?
\* Bounds: T1 relaxed by ONE late participant (MaxLateStart = 1); T2 strict
\* (MaxStopSkew = 0); no fault (MaxExpire = 0). All three participants share
\* the workload handle s1, as in testNodes3.
\* Attribution: a firing here is firedBy = "peerStop" (realization S1-i).
\* Realization S1-ii (the successor's EventThread re-determination listing a
\* third, not-yet-stopped participant) needs the T2 relaxation and is covered
\* by MC_hunt_s2.cfg (firedBy = "peerStop" there; probe TargetSafePeerStop).
SPECIFICATION MCSpec

CONSTANTS
    NoP = NoP
    NoSession = NoSession
    s1 = s1
    s2 = s2
    Participants = {p1, p2, p3}
    Sessions = {s1}
    SessionOf <- MCSessionOf
    SecondClient = {}
    ExpirableSessions = {}
    MaxLateStart = 1
    MaxStopSkew = 0
    MaxExpire = 0

SYMMETRY MCSymmetry

\* ---- Target property + the brief's two sanity invariants ----
INVARIANTS
    TargetSafe
    ListingFromServer
    NoDeadOwnerOffer

\* ---- Fault-setup liveness probe: run ALONE (instead of the block above);
\* ---- TLC must violate it, showing the MaxLateStart relaxation is used.
\* INVARIANTS
\*     LateStartUnused
