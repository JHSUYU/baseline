\* MC_hunt_s1.cfg: Scenario 1, an ancestor tagged LAZY_PERSIST after the file
\* exists (retroactive inheritance). Finding Q-S1.
\*
\* Only Scenario 1's budgets are set: one directory policy operation on any live
\* directory (/testAppendTwice or /), plus one file policy operation so the file
\* branch and its two rejections (FSDirAttrOp.java:446-460) are in the hunt. No
\* rename and no mkdir.
SPECIFICATION MCSpec

CONSTANTS
    CreateLazyFlag = FALSE
    CreatePolicyId = 0
    DefaultPolicy  = 7

    MaxDirPolicyOps     = 1
    MaxFilePolicyOps    = 1
    MaxRenames          = 0
    MaxMkdirs           = 0
    TagOnlyNonAncestors = FALSE

CONSTRAINT
    StopAfterTarget

INVARIANTS
    TargetSafe
    TypeOK
    CopyOnCreatePinned
