\* Hunt S3 variant, the brief's own route: as MC_hunt_s3_failover_dead_online.cfg, but the successor can only
\* register with the new master.
\* Hunt S3 (brief 2, MC-S3): the predecessor crashes (znode lingers) and is expired by the old master
\* (dispatcher fail-fast, RSPD:326-337); a master failover then records it online from ZK (RST:145-155) and
\* dead from its pending SCP (SM:446); the successor registers before `initialized`, expireServer returns
\* early (SM:675-678), so the predecessor stays online. The successor may also have registered with the old
\* master and be lost in the failover: the new master only records ZK children (RST:145-155).
\* Counters: one admin.move, one crash, one restart, one master failover; fail-fast limit small.
SPECIFICATION MCSpec
CONSTANTS
    NAddr = 2
    MaxInc = 3
    Region = {r1}
    HostOf <- MCSameHost
    MixedCaseHost = FALSE
    ForceRetain = TRUE
    ScpRetain = TRUE
    FailFastLimit = 2
    \* Scenario 3 counters
    MaxClientOps = 1
    MaxRsCrash = 1
    MaxRsDown = 1
    MaxRsRestart = 1
    MaxMasterFailover = 1
    \* not used by Scenario 3
    MaxRsStop = 0
    MaxClockStepBack = 0
    MaxSnryeTimeout = 0
    MaxRetainGiveUp = 0
    MaxPid = 5
    \* a firing step whose target is already retired is Scenario 1 (MC.tla HuntFocus)
    FocusMode = "stillOnlineLateRegister"
CONSTRAINT MCConstraint
INVARIANTS
    TargetSafe
CHECK_DEADLOCK FALSE
