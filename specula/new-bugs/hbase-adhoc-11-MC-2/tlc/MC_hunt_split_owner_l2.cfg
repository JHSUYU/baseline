\* MC_hunt_split_owner_l2.cfg -- Scenario 1 variant isolating leak L2 (brief S1, MC-1).
\* CLOSED parent rolled back to OPEN (STRP:505, 561, 604-605), then a well-formed assign.
\*   splits = 1, preOpFails = 1, operator ops <= 3, aborts = 0 so BFS cannot return L1 first.
\*   OperatorWaitsForSplit = TRUE as in MC_hunt_split_owner.cfg.  Every other counter is 0.
\*   MaxPid = 14: 3 ops x 3 ids, split 1, close child 2, reopen 2.
CONSTANTS
    Regions = {r1}
    Servers = {s1, s2}
    NoServer = NoServer
    MaxPid = 14
    OperatorWaitsForSplit = TRUE
    MaxRsgRetry = 1
    MaxOps = 3
    MaxDisables = 0
    MaxSplits = 1
    MaxAborts = 0
    MaxPreOpFails = 1
    MaxTruncates = 0
    MaxBalancerPlans = 0
    MaxCrashes = 0
    MaxFailovers = 0
    MaxDecoms = 0
    MaxRsgMoves = 0
    MaxRpcFails = 0

INIT MCInit
NEXT MCNext

SYMMETRY Symmetry

INVARIANT TargetSafe

CHECK_DEADLOCK FALSE
