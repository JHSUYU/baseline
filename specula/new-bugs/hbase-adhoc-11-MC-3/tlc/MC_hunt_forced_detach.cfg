\* MC_hunt_forced_detach.cfg -- Scenario 2 (brief sections 2, 5, 6.1 MC-2).
\* Truncate force-detaches (AM:1012-1018, AM:789-795) a TRSP that a balancer plan attached while
\* truncate held the region lock; the detached TRSP keeps running and its RS reports are dropped
\* (AM:1344-1354), stranding the region.
\*   truncates = 1, balancer plans = 1, operator ops <= 2.  Every other counter is 0.
\*   The SCP trigger is MC_hunt_forced_detach_scp.cfg.
\*   MaxPid = 14: truncate 1, its two children 4, balancer TRSP 3, 2 ops x 3 ids.
CONSTANTS
    Regions = {r1}
    Servers = {s1, s2}
    NoServer = NoServer
    MaxPid = 14
    OperatorWaitsForSplit = FALSE
    MaxRsgRetry = 1
    MaxOps = 2
    MaxDisables = 0
    MaxSplits = 0
    MaxAborts = 0
    MaxPreOpFails = 0
    MaxTruncates = 1
    MaxBalancerPlans = 1
    MaxCrashes = 0
    MaxFailovers = 0
    MaxDecoms = 0
    MaxRsgMoves = 0
    MaxRpcFails = 0

INIT MCInit
NEXT MCNext

SYMMETRY Symmetry

INVARIANT TargetSafe

CHECK_DEADLOCK FALSE
