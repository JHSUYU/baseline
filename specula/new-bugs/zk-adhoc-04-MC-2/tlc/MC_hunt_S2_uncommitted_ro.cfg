\* MC_hunt_S2_uncommitted_ro.cfg -- hunting configuration.
\* Scenario 2 (MEDIUM): read-only server serves logged-but-never-committed txns. Finding MC-2.
\*
\* shutdown(false) fast-forwards the shared zkDb through every LOGGED txn (ZooKeeperServer.java:928-940,
\* FileTxnSnapLog.java:330) and the read-only server serves that tree (QuorumPeer.java:1536).
\* Counters: one write, one stop of the leader after a follower logged+ACKed it and before the
\* commit (one abandoned proposal), AsyncApply = FALSE (apply lag is Scenario 3's mechanism).
\* Constraint ClientOnlyUncommitted keeps only executions in which the client holds 0 or a real
\* txn that is not committed, so every hit is class C.  (The brief proposed NoSyntheticClientZxid;
\* with it a committed write lets the much shorter class-D apply-lag hit end the search first.)
\*
\* Property: TargetSafe (the target's failing branch, ZooKeeperServer.java:1504-1516).
\* TypeOK and ClientZxidWasServed are the brief's two structural sanity invariants; they keep
\* the model honest under this hunt's faults and are not hunting targets.
\* Report bounds, distinct states, diameter and wall time with the result.

SPECIFICATION MCSpec

CONSTANTS
    Server = {1, 2, 3}
    Client = {1}
    ZB = 10
    RoEnabled = TRUE
    TrustEmptyDB = TRUE
    ClientCanBeRO = TRUE
    AsyncApply = FALSE

    MaxStops = 1
    MaxPartitions = 0
    MaxClientMoves = 0
    MaxClientWrites = 1
    MaxAbandonedProposals = 1
    MaxEpoch = 2

VIEW ModelView

CHECK_DEADLOCK FALSE

CONSTRAINT ClientOnlyUncommitted

INVARIANTS
    TargetSafe
    TypeOK
    ClientZxidWasServed
