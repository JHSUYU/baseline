\* Guided copy of spec/MC_hunt_s1_rotation_skew.cfg (pruning-only guides: W1 shape), started from
\* the registered steady state (a reachable state of the parent cfg after registration and one
\* heartbeat round), to show window W1 in a running cluster.
\* Scenario 1 (brief 2, MC-1): rotation skew at a mirroring DN.
\* One rotation whose push a mirroring DN has not applied (or applied before an
\* older token arrives) -- windows W1 (in-flight push) and W4 (registration
\* export before the live-list join; the DNs start unregistered so the
\* registrations overlap the rotation).  W3 needs two rotations: see
\* MC_hunt_s1_lost_push.cfg.  Only Scenario 1's counter is set (MaxRotations);
\* one client write, the overwrite flag on (condition (a)), encrypted transfer
\* (always on in the model, condition (b)).
SPECIFICATION MCSpec

CONSTANTS
    NN = {n1}
    DN = {d1, d2, d3}
    InitActive = n1
    None = None
    OverwriteQOP = TRUE
    Repl = 2
    XferTargets = 2
    StartRegistered = TRUE     \* steady state: every DN registered and heartbeating (reachable from FALSE)
    SkipNoopHeartbeats = TRUE
    MaxRotations = 1
    MaxFailovers = 0
    MaxRestarts = 0
    MaxDeadNodes = 0
    MaxXfers = 0
    MaxWrites = 1
    MaxReads = 0

SYMMETRY DNSymmetry
CHECK_DEADLOCK FALSE

ACTION_CONSTRAINT
    GuideMarkFollowsRotate
    GuideNoRotateInRegGap

INVARIANTS
    \* target (or a refinement of it that selects one window)
    TargetSafe
    \* structural sanity under this Scenario's faults (brief 5; adhoc Shared Rule 1)
    TypeOK
    TokenProvenance
