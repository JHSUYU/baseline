\* MC_hunt_rollback_cache.cfg - Scenario 2 (brief §2, finding MC-2).
\* The cached promise survives rollback: Journal.doRollback reverts the disk
\* but not the PersistentLongFile cache (J:1189-1196 vs J:251-260); restarted
\* JNs reload the pre-upgrade value E_up; a writer reading only restarted JNs
\* picks E_up + 1 while a JN that stayed up still caches E_max >= E_up + 2.
\* Minimal trace (brief §2): the E_up writer upgrades, 2 more writers raise the
\* promises, all 3 stop (3 stops), rollback, 2 JN restarts, the 4th writer.
\* Only this Scenario's counters are set: stop, restart, upgrade, rollback.
\* Loss is 0. NoOverlap and DropOnStop exclude designed fencing D1-D3.
\*
\* Phase 3 scope (changelog "Bug Hunting"): StopInNewEpoch = FALSE. The first
\* run of this cfg (StopInNewEpoch unrestricted, kept as
\* output/MC_hunt_rollback_cache_run1.cfg) violated TargetSafe through
\* Scenario 1's trigger instead - two WriterStop in state "ne" leaving orphan
\* promises (MC-1) - without any upgrade, rollback or restart. Forbidding a
\* stop while a writer waits for its newEpoch quorum removes that trigger
\* (with MaxLoss = 0 no other step can fail an epoch attempt that a majority
\* would accept) and keeps every step of Scenario 2's minimal trace, whose
\* writers stop only after they established their epoch.

SPECIFICATION MCSpec

CONSTANTS
    JN = {j0, j1, j2}
    MaxWriters = 4
    ReqRounds = 1
    NoOverlap = TRUE
    DropOnStop = TRUE

    MaxLoss = 0
    MaxStops = 3
    MaxRestarts = 2
    MaxUpgrades = 1
    MaxRollbacks = 1
    StopInNewEpoch = FALSE

SYMMETRY Symmetry

INVARIANTS
    \* Oracle
    TargetSafe
    \* Structural sanity (brief §5; ad hoc Shared Rule 1 allows one or two)
    TypeOK
    ReqCarriesSenderEpoch

CHECK_DEADLOCK FALSE
