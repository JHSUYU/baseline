id: hdfs-adhoc-k2
system: Apache Hadoop HDFS
check:
  file: hadoop-hdfs-project/hadoop-hdfs/src/main/java/org/apache/hadoop/hdfs/security/token/block/BlockTokenSecretManager.java
  line: 512
  method: BlockTokenSecretManager.retrievePassword(BlockTokenIdentifier)
  thrown: org.apache.hadoop.security.token.SecretManager.InvalidToken
  guard: key == null   (key = allKeys.get(identifier.getKeyId()))
workload:
  module: hadoop-hdfs-project/hadoop-hdfs
  test: org.apache.hadoop.hdfs.server.namenode.ha.TestAdhocWorkload2#run
build:
  test_command: mvn -B -o surefire:test -pl hadoop-hdfs-project/hadoop-hdfs -Dtest='<Class>#<method>' -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false
